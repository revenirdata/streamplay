name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flink-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium --with-deps
      - name: Inspect actual input, kill worker, verify checkpoint restore and output
        run: node scripts/flink-recovery-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flink-worker-recovery-evidence
          path: .streamplay/evidence/flink-recovery/
          include-hidden-files: true
      - if: always()
        run: docker compose -p streamplay-recovery -f examples/kafka-flink/compose.yaml -f examples/kafka-flink/recovery.compose.yaml down --volumes --remove-orphans
  mqtt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start isolated MQTT broker
        run: docker run -d --name streamplay-mqtt-test -p 127.0.0.1:18884:1883 -v "$PWD/examples/adapters/mosquitto-test.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2.0.22
      - run: node scripts/mqtt-integration.js
      - run: node scripts/lab-integration.js mqtt
      - run: node scripts/recovery-integration.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-reconciliation-evidence
          path: .streamplay/evidence/delivery/
          include-hidden-files: true
      - if: always()
        run: docker rm -f streamplay-mqtt-test
  workbench:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.os }}
          path: test-results/
  queue-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker run -d --name streamplay-queues -p 127.0.0.1:4567:4566 -e SERVICES=sqs,kinesis -e SQS_ENDPOINT_STRATEGY=path -e LOCALSTACK_HOST=127.0.0.1:4567 localstack/localstack:4.14.0
      - run: node scripts/lab-integration.js queues
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-recovery-evidence
          path: .streamplay/evidence/
          include-hidden-files: true
      - if: always()
        run: docker rm -f streamplay-queues
  kafka-flink:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run example:up
      - run: npm run test:integration
      - name: Container logs
        if: always()
        run: docker compose -f examples/kafka-flink/compose.yaml logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-flink-runs
          path: .streamplay/runs/
          include-hidden-files: true
      - if: always()
        run: npm run example:down
