name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workbench:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.os }}
          path: test-results/
  kafka-flink:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run example:up
      - run: npm run test:integration
      - name: Container logs
        if: always()
        run: docker compose -f examples/kafka-flink/compose.yaml logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-flink-runs
          path: .streamplay/runs/
          include-hidden-files: true
      - if: always()
        run: npm run example:down
